name: CI

# Path-aware required feedback for normal product work. Full frontend,
# rendered-UI, Rust, historical A6/A7, and release evidence remain available
# in full-confidence.yml without blocking every bounded Work Unit.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changed owners
    runs-on: windows-latest
    outputs:
      base: ${{ steps.classify.outputs.base }}
      frontend: ${{ steps.classify.outputs.frontend }}
      frontend_full: ${{ steps.classify.outputs.frontend_full }}
      ui: ${{ steps.classify.outputs.ui }}
      rust: ${{ steps.classify.outputs.rust }}
      rust_full: ${{ steps.classify.outputs.rust_full }}
      pty: ${{ steps.classify.outputs.pty }}
      dependencies: ${{ steps.classify.outputs.dependencies }}
      policy: ${{ steps.classify.outputs.policy }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Classify owner paths
        id: classify
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if ($env:EVENT_NAME -eq "workflow_dispatch") {
            $base = git rev-parse HEAD^
            $files = @(git ls-files)
          } elseif ($env:EVENT_NAME -eq "pull_request") {
            $base = $env:PR_BASE_SHA
            $files = @(git diff --name-only $base $env:HEAD_SHA)
          } elseif ($env:BEFORE_SHA -and $env:BEFORE_SHA -notmatch '^0+$') {
            $base = $env:BEFORE_SHA
            $files = @(git diff --name-only $base $env:HEAD_SHA)
          } else {
            $base = git rev-parse HEAD^
            $files = @(git diff --name-only $base $env:HEAD_SHA)
          }

          function Has-Path([string]$pattern) {
            return [bool]($files | Where-Object { $_ -match $pattern } | Select-Object -First 1)
          }

          $workflow = Has-Path '^\.github/workflows/'
          $frontend = $workflow -or (Has-Path '^(index\.html$|public/|assets/|src/|e2e/|scripts/run-frontend-tests\.mjs$|package\.json$|pnpm-lock\.yaml$|vite\.config|vitest|tsconfig|playwright)')
          $frontendFull = $workflow -or (Has-Path '^(pnpm-lock\.yaml$|vite\.config|vitest|tsconfig|src/(App\.tsx$|main\.tsx$|features/app/|shared/(store|types)/))')
          $ui = $workflow -or (Has-Path '^(index\.html$|public/|assets/|src/|e2e/|package\.json$|pnpm-lock\.yaml$|playwright\.config\.ts$)')
          $rust = $workflow -or (Has-Path '^(src-tauri/|.*Cargo\.(toml|lock)$)')
          $rustFull = $workflow -or (Has-Path '^(src-tauri/(src/|tests/|vendor/|build\.rs$|Cargo\.(toml|lock)$|pty-server/(src/|tests/|build\.rs$|Cargo\.(toml|lock)$)))')
          $pty = $workflow -or (Has-Path '^(src-tauri/(pty-server/|vendor/|Cargo\.(toml|lock)$|src/(lib\.rs$|startup_reconciliation\.rs$|api/|command_risk/|db/|logging/|pty/)))')
          $dependencies = $workflow -or (Has-Path '(^|/)(package\.json|pnpm-lock\.yaml|Cargo\.toml|Cargo\.lock)$')
          $policy = $workflow -or (Has-Path '^(README\.md|CONTRIBUTING\.md|AGENTS\.md|AI_GUIDE\.md|GOAL\.md|DECISION_FRAMEWORK\.md|DELEGATION_FRAMEWORK\.md|DECISIONS\.md|ARCHITECTURE\.md|product-delivery-instructions\.md|tasks/README\.md|contracts/README\.md|docs/(README\.md|requirements\.md|PUBLICATION_READINESS\.md|AGENT_WORKFLOWS\.md)|scripts/(verify-ai-decision-knowledge|verify-release-hygiene-contract)\.mjs)$')

          "base=$base" >> $env:GITHUB_OUTPUT
          "frontend=$($frontend.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "frontend_full=$($frontendFull.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "ui=$($ui.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "rust=$($rust.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "rust_full=$($rustFull.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "pty=$($pty.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "dependencies=$($dependencies.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "policy=$($policy.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

          Write-Host "Base: $base"
          Write-Host "Changed files: $($files.Count)"
          $files | ForEach-Object { Write-Host " - $_" }
          Write-Host "frontend=$frontend frontendFull=$frontendFull ui=$ui rust=$rust rustFull=$rustFull pty=$pty dependencies=$dependencies policy=$policy"

  frontend-fast:
    name: Frontend fast (tsc + changed Vitest)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm exec tsc --noEmit
      - name: Tests affected by this change
        if: needs.changes.outputs.frontend_full != 'true'
        run: node scripts/run-frontend-tests.mjs --base "${{ needs.changes.outputs.base }}" --pool=forks
      - name: Full frontend tests for broad or high-risk owner changes
        if: needs.changes.outputs.frontend_full == 'true'
        run: pnpm test:full --pool=forks
      - name: Biome lint (informational while CRLF formatting is separate)
        continue-on-error: true
        run: pnpm exec biome lint src

  ui-smoke:
    name: UI smoke (source contract + critical journeys)
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install chromium
      - name: Enforced UI trust source contract
        run: pnpm verify:ui:trust
      - name: Critical rendered journeys
        shell: pwsh
        env:
          AELYRIS_E2E_PROJECT_PATH: ${{ github.workspace }}
          AELYRIS_E2E_EXTERNAL_DASHBOARD: "0"
          AELYRIS_PLAYWRIGHT_BASE_URL: "http://127.0.0.1:1420"
        run: |
          $ciDir = Join-Path $env:GITHUB_WORKSPACE ".codex-auto\ci"
          New-Item -ItemType Directory -Force -Path $ciDir | Out-Null
          $stdout = Join-Path $ciDir "vite-ui-smoke.out.log"
          $stderr = Join-Path $ciDir "vite-ui-smoke.err.log"
          $server = Start-Process -WindowStyle Hidden -FilePath "pnpm.cmd" -ArgumentList @("dev", "--host", "127.0.0.1", "--port", "1420") -WorkingDirectory $env:GITHUB_WORKSPACE -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          $exitCode = 0
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              try {
                $response = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:1420/" -TimeoutSec 3
                if ($response.StatusCode -eq 200) {
                  $ready = $true
                  break
                }
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            if (-not $ready) {
              Get-Content -Path $stdout -ErrorAction SilentlyContinue
              Get-Content -Path $stderr -ErrorAction SilentlyContinue
              throw "Vite server did not become ready on port 1420"
            }
            $changedSpecs = @(git diff --name-only "${{ needs.changes.outputs.base }}" "${{ github.sha }}" -- "e2e/*.spec.ts")
            if ($changedSpecs.Count -gt 0) {
              Write-Host "Running directly changed Playwright specs: $($changedSpecs -join ', ')"
              pnpm exec playwright test @changedSpecs --project=frontend
            } else {
              pnpm test:e2e:smoke
            }
            $exitCode = $LASTEXITCODE
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }
          exit $exitCode
      - name: Upload UI smoke artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-smoke-${{ github.sha }}
          path: |
            .codex-auto/quality/ui-trust-contract.json
            .codex-auto/ci/**
            test-results/**
          if-no-files-found: warn

  rust-fast:
    name: Rust fast (cargo check)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: |
            src-tauri -> target
            src-tauri/pty-server -> target
      - name: App library check
        if: needs.changes.outputs.rust_full != 'true'
        run: cargo check --manifest-path src-tauri/Cargo.toml --lib
      - name: PTY sidecar check
        if: needs.changes.outputs.pty == 'true' && needs.changes.outputs.rust_full != 'true'
        run: cargo check --manifest-path src-tauri/pty-server/Cargo.toml
      - name: Full Rust app owner tests
        if: needs.changes.outputs.rust_full == 'true'
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets
      - name: Full PTY sidecar tests
        if: needs.changes.outputs.pty == 'true' && needs.changes.outputs.rust_full == 'true'
        run: cargo test --manifest-path src-tauri/pty-server/Cargo.toml

  dependency-risk:
    name: Dependency risk (only when manifests change)
    needs: changes
    if: needs.changes.outputs.dependencies == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install cargo-audit
        uses: taiki-e/install-action@2ca9b94c269419b7b0c711c09d0b21c4e1d51145 # v2
        with:
          tool: cargo-audit
      - name: Stack-risk classification
        run: pnpm verify:stack-risk

  policy-fast:
    name: Workflow policy consistency
    needs: changes
    if: needs.changes.outputs.policy == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: AI decision knowledge gate
        run: pnpm verify:ai-decision-knowledge
      - name: Public and release hygiene gate
        run: pnpm verify:release:hygiene

  required-fast-ci:
    name: Required fast CI
    needs: [changes, frontend-fast, ui-smoke, rust-fast, dependency-risk, policy-fast]
    if: always()
    runs-on: windows-latest
    timeout-minutes: 5
    env:
      NEEDS_JSON: ${{ toJSON(needs) }}
    steps:
      - name: Require every selected owner lane to pass
        shell: pwsh
        run: |
          $needs = $env:NEEDS_JSON | ConvertFrom-Json
          $selected = @{
            "frontend-fast" = $needs.changes.outputs.frontend
            "ui-smoke" = $needs.changes.outputs.ui
            "rust-fast" = $needs.changes.outputs.rust
            "dependency-risk" = $needs.changes.outputs.dependencies
            "policy-fast" = $needs.changes.outputs.policy
          }
          $bad = @()
          if ($needs.changes.result -ne "success") {
            $bad += "changes=$($needs.changes.result)"
          }
          foreach ($entry in $selected.GetEnumerator()) {
            $result = $needs.PSObject.Properties[$entry.Key].Value.result
            if ($entry.Value -eq "true" -and $result -ne "success") {
              $bad += "$($entry.Key)=$result (selected)"
            }
            if ($result -in @("failure", "cancelled")) {
              $bad += "$($entry.Key)=$result"
            }
          }
          if ($bad.Count -gt 0) {
            $bad | Sort-Object -Unique | ForEach-Object { Write-Error $_ }
            exit 1
          }
          $needs.PSObject.Properties | ForEach-Object {
            Write-Host "$($_.Name)=$($_.Value.result)"
          }
